    RESIDENT: load = B8, run = RES, type = ro, define = yes;
    RES2:     load = B8, run = R2,  type = ro, define = yes;
    KENT:     load = B8, run = KE,  type = ro, define = yes;
    BOOT2:    load = B8, run = BR,  type = ro, define = yes;
    RES3:     load = B8, run = R3,  type = ro, define = yes;
    RES5:     load = B8, run = R5,  type = ro, define = yes;
    SND:      load = B12, type = ro;
    SAVE:     load = B12, run = SV,  type = rw, define = yes;
    VECT:     load = B8, run = VE,  type = ro, define = yes;
    EAPI:     load = EA, type = ro;
    RES6:     load = B8, run = R6,  type = ro, define = yes;
    RES7:     load = B8, run = R7,  type = rw, define = yes;
    RES8:     load = B8, run = R8,  type = rw, define = yes;
    RES9:     load = B8, run = R9,  type = rw, define = yes;
}
