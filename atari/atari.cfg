MEMORY {
    B8:  file = "%O.b8", start = $8000, size = $4000, fill = yes, fillval = $FF;
    B9:  file = "%O.b9", start = $8000, size = $4000, fill = yes, fillval = $FF;
    RES: file = "", start = $F100, size = $0400;
    R2:  file = "", start = $F900, size = $03C0;
    KE:  file = "", start = $FF48, size = $0040;
    BR:  file = "", start = $E000, size = $0200;
    R3:  file = "", start = $FD50, size = $00D0;
    R5:  file = "", start = $F0BF, size = $0031;
    B12: file = "%O.b12", start = $8000, size = $4000, fill = yes, fillval = $FF;
    VE:  file = "", start = $FFFA, size = $0006;
    R6:  file = "", start = $DD10, size = $00F0;
    R7:  file = "", start = $DF00, size = $0080;
    R8:  file = "", start = $FF88, size = $0072;
    R9:  file = "", start = $DFA0, size = $0060;
    SV:  file = "", start = $B000, size = $0400;
